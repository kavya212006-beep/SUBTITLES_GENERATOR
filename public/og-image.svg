<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#17171a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0070f3" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#50e3c2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Border -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Badge -->
  <g transform="translate(80, 100)">
    <rect width="200" height="40" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.16)"/>
    <circle cx="24" cy="20" r="5" fill="#00dfd8"/>
    <text x="42" y="25" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">AI FONT FINDER</text>
  </g>

  <!-- Title -->
  <text x="80" y="230" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">Font Finder AI</text>

  <!-- Subtitle -->
  <text x="80" y="300" fill="#e0e0e0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="500">Identify Any Font from Image or Text Instantly</text>

  <!-- Features pills -->
  <g transform="translate(80, 370)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="280" height="52" rx="26" fill="rgba(0,112,243,0.15)" stroke="#0070f3" stroke-width="1.5"/>
    <text x="30" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">🎯 1,000+ Fonts Match</text>

    <!-- Pill 2 -->
    <rect x="300" y="0" width="260" height="52" rx="26" fill="rgba(80,227,194,0.15)" stroke="#50e3c2" stroke-width="1.5"/>
    <text x="330" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">🆓 100% Free Fonts</text>

    <!-- Pill 3 -->
    <rect x="580" y="0" width="270" height="52" rx="26" fill="rgba(121,40,202,0.15)" stroke="#7928ca" stroke-width="1.5"/>
    <text x="610" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">⚡ Instant AI Detection</text>
  </g>

  <!-- URL footer -->
  <text x="80" y="530" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">fontfinderai.com</text>
</svg>